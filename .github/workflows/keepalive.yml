# Keeps the free Supabase project from pausing for inactivity.
# Runs twice a day and makes a real database query through the public API.
# If the database ever can't be reached, this run fails and GitHub emails the repo owner.
name: Keep database awake

on:
  schedule:
    - cron: '17 3,15 * * *'   # 03:17 and 15:17 UTC daily
  workflow_dispatch:           # "Run workflow" button for a manual check

permissions:
  contents: write              # only used to keep this schedule from being auto-disabled

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Query the database
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js | head -1)
          KEY=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" config.js | head -1)
          for attempt in 1 2 3; do
            code=$(curl -s -o out.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/is_email_approved" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d '{"p_email":"keepalive@example.com"}')
            echo "Attempt $attempt: HTTP $code — $(cat out.txt)"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::Supabase did not respond. The project may be paused — open supabase.com and click Resume project."
          exit 1

      # GitHub turns off scheduled workflows in public repos after 60 days with no commits.
      # Touch a small file every ~45 days so this keeps running on its own.
      - name: Keep this schedule enabled
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive-stamp
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive-stamp
            git commit -m "Keep database-awake schedule enabled [skip ci]"
            git push
          else
            echo "Recent commit found; nothing to do."
          fi
