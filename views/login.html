<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1d33"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><link rel="icon" href="/pass-logo.png"><title>Log in · CPSC Membership</title></head>
<body data-nav="guest">
<section class="hero"><div class="eyebrow">Live to ski, love to party</div><h1>Member Login</h1><p>Your CPSC membership card, right in your phone's wallet.</p></section>
<main class="narrow"><form class="panel" id="f">
  <label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required>
  <label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required>
  <button class="btn block" type="submit">Log in</button>
  <div class="msg" id="msg"></div>
  <p class="muted center" style="margin-top:18px">New member? <a href="/signup">Create your account</a></p>
</form></main>
<footer>Central Pacific Ski Club · San Luis Obispo</footer>
<script src="/app.js"></script>
<script>
$('#f').onsubmit = async (e) => {
  e.preventDefault();
  try { await api('/api/login', { json: { email: $('#email').value, password: $('#password').value } }); location.href = '/card'; }
  catch (err) { showMsg($('#msg'), err.message); }
};
</script></body></html>
