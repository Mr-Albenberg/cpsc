<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1d33"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><link rel="icon" href="/pass-logo.png"><title>Members · CPSC Admin</title></head>
<body data-nav="admin">
<section class="hero"><div class="eyebrow">Exec board</div><h1>Members</h1><p>Approve emails so people can sign up, and see who's been scanned in.</p></section>
<main>
  <div class="grid">
    <form class="panel" id="af">
      <h2>Approve emails</h2>
      <p class="muted">Paste one or many — separated by commas, spaces or new lines.</p>
      <textarea id="emails" rows="5" placeholder="jane@calpoly.edu, sam@gmail.com"></textarea>
      <label for="note">Note (optional)</label><input type="text" id="note" placeholder="e.g. Paid dues Fall 2026">
      <button class="btn block" type="submit">Approve</button>
      <div class="msg" id="amsg"></div>
    </form>
    <div class="panel">
      <div class="toolbar"><h2 style="margin:0">Approved list</h2><input type="search" id="aq" placeholder="Search…"></div>
      <div class="table-wrap" style="max-height:340px;overflow-y:auto"><table><thead><tr><th>Email</th><th>Status</th><th></th></tr></thead><tbody id="approved"></tbody></table></div>
    </div>
  </div>
  <div class="panel">
    <div class="toolbar"><h2 style="margin:0">Members <span class="pill" id="count"></span></h2><input type="search" id="mq" placeholder="Search members…"></div>
    <div class="table-wrap"><table><thead><tr><th>Member</th><th>Last scanned</th><th>Scans</th><th>Role</th><th></th></tr></thead><tbody id="members"></tbody></table></div>
  </div>
</main>
<footer>Central Pacific Ski Club · Admin</footer>
<script src="/app.js"></script>
<script>
let approved = [], members = [];
const drawApproved = () => {
  const q = $('#aq').value.toLowerCase();
  $('#approved').innerHTML = approved.filter(a => a.email.includes(q)).map(a => `<tr>
    <td>${esc(a.email)}${a.note ? `<div class="muted">${esc(a.note)}</div>` : ''}</td>
    <td>${a.registered ? '<span class="pill ok">Signed up</span>' : '<span class="pill">Waiting</span>'}</td>
    <td style="text-align:right"><button class="btn danger small" data-unapprove="${esc(a.email)}">Remove</button></td></tr>`).join('')
    || '<tr><td colspan="3" class="muted">No approved emails yet.</td></tr>';
};
const drawMembers = () => {
  const q = $('#mq').value.toLowerCase();
  const list = members.filter(m => (m.name + ' ' + m.email).toLowerCase().includes(q));
  $('#count').textContent = members.length;
  $('#members').innerHTML = list.map(m => `<tr>
    <td><img class="avatar" src="/api/admin/photo/${m.id}" alt="" loading="lazy"><strong>${esc(m.name)}</strong><div class="muted" style="margin-left:42px">${esc(m.email)}</div></td>
    <td>${m.last_scan ? esc(fmtTime(m.last_scan)) : '<span class="muted">Never</span>'}</td>
    <td>${m.scan_count}</td>
    <td>${m.is_admin ? '<span class="pill admin">Admin</span>' : '<span class="pill">Member</span>'}
      <button class="btn ghost small" data-admin="${m.id}" data-to="${m.is_admin ? 0 : 1}">${m.is_admin ? 'Remove admin' : 'Make admin'}</button></td>
    <td style="text-align:right"><button class="btn danger small" data-del="${m.id}" data-name="${esc(m.name)}">Remove</button></td></tr>`).join('')
    || '<tr><td colspan="5" class="muted">No members yet.</td></tr>';
};
const load = async () => {
  [approved, members] = await Promise.all([api('/api/admin/approved'), api('/api/admin/members')]);
  drawApproved(); drawMembers();
};
$('#aq').oninput = drawApproved; $('#mq').oninput = drawMembers;
$('#af').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const r = await api('/api/admin/approved', { json: { emails: $('#emails').value, note: $('#note').value } });
    showMsg($('#amsg'), `Approved ${r.added} email${r.added === 1 ? '' : 's'}${r.skipped ? ` (${r.skipped} already on the list)` : ''}.`, true);
    $('#emails').value = ''; load();
  } catch (err) { showMsg($('#amsg'), err.message); }
};
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.unapprove) {
      if (!confirm(`Remove ${b.dataset.unapprove} from the approved list? (Existing accounts are not deleted.)`)) return;
      await api('/api/admin/approved/' + encodeURIComponent(b.dataset.unapprove), { method: 'DELETE' });
    } else if (b.dataset.del) {
      if (!confirm(`Remove ${b.dataset.name}'s account? Their card will stop scanning as valid.`)) return;
      await api('/api/admin/members/' + b.dataset.del, { method: 'DELETE' });
    } else if (b.dataset.admin) {
      await api(`/api/admin/members/${b.dataset.admin}/admin`, { json: { isAdmin: b.dataset.to === '1' } });
    } else return;
    load();
  } catch (err) { alert(err.message); }
});
load();
</script></body></html>
