<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1d33"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><link rel="icon" href="/pass-logo.png"><title>Scan · CPSC Admin</title></head>
<body data-nav="admin">
<section class="hero"><div class="eyebrow">Check-in</div><h1>Scan a Card</h1><p>Point the camera at a member's wallet QR code.</p></section>
<main><div class="scanner">
  <div class="panel" style="padding:14px">
    <div id="reader"></div>
    <div class="center" style="margin-top:12px"><button class="btn" id="start">Start camera</button></div>
  </div>
  <div class="result" id="result">
    <div class="status" id="status"></div>
    <img id="rphoto" alt="">
    <div class="name" id="rname"></div>
    <div class="last" id="rlast"></div>
    <p class="muted" id="rmeta"></p>
    <button class="btn dark" id="next">Scan next</button>
  </div>
</div></main>
<footer>Camera access needs HTTPS (or localhost).</footer>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/app.js"></script>
<script>
const scanner = new Html5Qrcode('reader');
let busy = false, timer;
const beep = (ok) => { try { const c = new AudioContext(), o = c.createOscillator(); o.frequency.value = ok ? 880 : 220; o.connect(c.destination); o.start(); o.stop(c.currentTime + .15); } catch {} navigator.vibrate?.(ok ? 80 : [60, 40, 60]); };
async function onScan(code) {
  if (busy) return; busy = true;
  try { scanner.pause(true); } catch {}
  const box = $('#result');
  try {
    const r = await api('/api/admin/scan', { json: { code } });
    box.className = 'result show';
    $('#status').textContent = '✓ Valid member';
    $('#rphoto').style.display = r.member.photoUrl ? '' : 'none';
    if (r.member.photoUrl) $('#rphoto').src = r.member.photoUrl;
    $('#rname').textContent = r.member.name;
    $('#rlast').innerHTML = 'Last scanned<strong>' + esc(r.lastScan ? fmtTime(r.lastScan) : 'First scan — welcome!') + '</strong>';
    $('#rmeta').textContent = (r.lastScannedBy ? 'by ' + r.lastScannedBy + ' · ' : '') + r.totalScans + ' total check-in' + (r.totalScans === 1 ? '' : 's');
    beep(true);
  } catch (err) {
    box.className = 'result show bad';
    $('#status').textContent = '✕ Not valid';
    $('#rphoto').style.display = 'none';
    $('#rname').textContent = 'Not recognized';
    $('#rlast').textContent = err.message; $('#rmeta').textContent = '';
    beep(false);
  }
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  clearTimeout(timer); timer = setTimeout(next, 10000);
}
function next() {
  clearTimeout(timer); $('#result').className = 'result'; busy = false;
  try { scanner.resume(); } catch {}
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('#next').onclick = next;
$('#start').onclick = async () => {
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * .7); return { width: s, height: s }; } }, onScan);
    $('#start').style.display = 'none';
  } catch (e) { alert('Could not open the camera: ' + e + '\nMake sure the site is on HTTPS and camera permission is allowed.'); }
};
</script></body></html>
