<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1d33"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><link rel="icon" href="/pass-logo.png"><title>Create account · CPSC Membership</title></head>
<body data-nav="guest">
<section class="hero"><div class="eyebrow">Members only</div><h1>Create Your Account</h1><p>Use the email you joined CPSC with. Only emails approved by the exec board can sign up.</p></section>
<main class="narrow"><form class="panel" id="f" enctype="multipart/form-data">
  <label>Your photo</label>
  <div class="photo-pick"><label for="photo" class="preview" id="preview" style="margin:0;cursor:pointer"></label>
    <div><label for="photo" class="btn ghost small" style="margin:0">Choose photo</label><div class="muted" style="margin-top:6px">A clear face photo — admins see it when they scan you in.</div></div>
    <input type="file" id="photo" name="photo" accept="image/*" required></div>
  <label for="name">Full name</label><input type="text" id="name" name="name" autocomplete="name" required maxlength="80">
  <label for="email">Email</label><input type="email" id="email" name="email" autocomplete="email" required>
  <label for="password">Password</label><input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
  <button class="btn block" type="submit" id="go">Create account</button>
  <div class="msg" id="msg"></div>
  <p class="muted center" style="margin-top:18px">Already have one? <a href="/login">Log in</a></p>
</form></main>
<footer>Central Pacific Ski Club · San Luis Obispo</footer>
<script src="/app.js"></script>
<script>
$('#photo').onchange = (e) => { const f = e.target.files[0]; if (f) { $('#preview').style.backgroundImage = 'url(' + URL.createObjectURL(f) + ')'; $('#preview').style.borderStyle = 'solid'; } };
$('#f').onsubmit = async (e) => {
  e.preventDefault();
  if (!$('#photo').files[0]) return showMsg($('#msg'), 'Please add a photo of yourself.');
  $('#go').disabled = true;
  try { await api('/api/signup', { method: 'POST', body: new FormData(e.target) }); location.href = '/card'; }
  catch (err) { showMsg($('#msg'), err.message); $('#go').disabled = false; }
};
</script></body></html>
