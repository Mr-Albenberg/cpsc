<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ecffb0"><meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Questrial&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"><link rel="icon" href="img/icon.png"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><title>Scan · CPSC Membership</title></head>
<body>
<section class="hero"><div class="eyebrow">Check-in</div><h1>Scan a Card</h1><p>Point the camera at a member's wallet QR code.</p></section>
<main>
<div class="scanner">
  <div class="code-chip" id="scanCode">Check-in code: …</div>
  <div class="panel" style="padding:14px">
    <div id="reader"></div>
    <div class="center" style="margin-top:12px"><button class="btn" id="start" type="button">Start camera</button></div>
    <details class="manual"><summary>No camera? Upload a photo of the QR code</summary>
      <input type="file" id="qrfile" accept="image/*"></details>
  </div>
  <div class="result" id="result">
    <div class="status" id="status"></div>
    <div class="status-sub" id="statusSub"></div>
    <img id="rphoto" alt="">
    <div class="name" id="rname"></div>
    <div class="rnum" id="rnum"></div>
    <dl class="profile" id="rprofile"></dl>
    <div class="code-check" id="rcode"></div>
    <button class="btn dark" id="next" type="button">Scan next</button>
  </div>
</div>
</main>
<footer class="site-footer">
  <img src="img/logo-white.png" alt="CPSC">
  <div class="tag">Live to ski, love to party</div>
  <nav class="links" aria-label="Central Pacific Ski Club">
    <a href="https://cpsconline.com/about/">About</a>
    <a href="https://cpsconline.com/small-trip-info-page/">Events</a>
    <a href="https://cpsconline.com/big-trip-2027/">Big Trip 2027</a>
    <a href="https://cpsconline.com/sponsors/">Sponsors</a>
    <a href="https://cpsconline.com/membership-discounts/">Member Discounts</a>
    <a href="https://cpsconline.com/exec-board-26-27/">Exec Board</a>
  </nav>
  <div>Central Pacific Ski Club · San Luis Obispo · <a href="https://cpsconline.com" style="color:#fff">cpsconline.com</a></div>
</footer>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
boot('admin').then(() => {
  const scanner = new Html5Qrcode('reader');
  let weekCode = null;
  const loadCode = async () => { weekCode = await getWeekCode(); if (weekCode) $('#scanCode').innerHTML = 'Real cards show <b>' + esc(weekCode.text) + '</b> in the top corner'; };
  loadCode(); setInterval(loadCode, 60000);
  let busy = false, timer;
  const beep = (ok) => {
    try { const c = new AudioContext(), o = c.createOscillator(); o.frequency.value = ok ? 880 : 220; o.connect(c.destination); o.start(); o.stop(c.currentTime + 0.15); } catch {}
    navigator.vibrate?.(ok ? 80 : [60, 40, 60]);
  };
  const row = (k, v) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`;
  function show(state, title, sub) {
    $('#result').className = 'result show ' + state;
    $('#status').textContent = title;
    $('#statusSub').textContent = sub || '';
  }
  function bad(text) {
    show('bad', '✕ Not valid', text);
    $('#rphoto').style.display = 'none';
    $('#rname').textContent = ''; $('#rnum').textContent = '';
    $('#rprofile').innerHTML = ''; $('#rcode').innerHTML = '';
    beep(false);
  }
  async function onScan(code) {
    if (busy) return; busy = true;
    try { scanner.pause(true); } catch {}
    const { data: r, error } = await sb.rpc('scan_card', { p_code: code });
    if (error) bad(error.message);
    else if (!r.valid) bad(r.error);
    else {
      const m = r.member;
      if (r.scannedWithin24h) show('warn', '! Already checked in today', 'Valid member, but this card was scanned ' + fmtTime(r.lastScan).split(' · ')[1] + (r.lastScannedBy ? ' by ' + r.lastScannedBy : '') + '.');
      else show('', '✓ Valid member', r.lastScan ? 'First check-in today.' : 'First check-in ever — welcome!');
      $('#rname').textContent = m.name;
      $('#rnum').textContent = [m.memberNo ? '#' + String(m.memberNo).padStart(4, '0') : '', m.isAdmin ? 'Exec board' : 'Member'].filter(Boolean).join(' · ');
      $('#rprofile').innerHTML =
        row('Email', m.email) +
        row('Member since', m.since ? new Date(m.since).toLocaleDateString([], { month: 'short', year: 'numeric' }) : '—') +
        row('Last scanned', r.lastScan ? fmtTime(r.lastScan) : 'Never') +
        row('Check-ins', r.totalScans + ' total' + (r.scansLast24h ? ` · ${r.scansLast24h + 1} in the last 24 h` : ''));
      $('#rcode').innerHTML = weekCode ? 'Their card should show <b>' + esc(weekCode.text) + '</b> in the top corner and match this photo.' : '';
      const url = await signedPhoto(m.id);
      $('#rphoto').style.display = url ? '' : 'none';
      if (url) $('#rphoto').src = url;
      beep(!r.scannedWithin24h);
    }
    $('#result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    clearTimeout(timer); timer = setTimeout(next, 10000);
  }
  function next() {
    clearTimeout(timer); $('#result').className = 'result'; busy = false;
    try { scanner.resume(); } catch {}
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  $('#next').onclick = next;
  $('#qrfile').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { const text = await scanner.scanFile(f, false); busy = false; onScan(text); }
    catch { busy = false; bad("Couldn't find a QR code in that picture."); }
    e.target.value = '';
  };
  $('#start').onclick = async () => {
    try {
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } }, onScan);
      $('#start').style.display = 'none';
    } catch (e) { alert('Could not open the camera: ' + e + '\nAllow camera access for this site and try again.'); }
  };
}).catch(() => {});
</script>
</body></html>
