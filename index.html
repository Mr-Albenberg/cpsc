<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1d33"><meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"><link rel="icon" href="img/logo.png"><title>Log in · CPSC Membership</title></head>
<body>
<section class="hero"><div class="eyebrow">Live to ski, love to party</div><h1>Member Login</h1><p>Your CPSC membership card, right in your phone's wallet.</p></section>
<main class="narrow">
<form class="panel" id="f">
  <label for="email">Email</label><input type="email" id="email" autocomplete="email" required>
  <label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required>
  <button class="btn block" type="submit" id="go">Log in</button>
  <div class="msg" id="msg"></div>
  <p class="muted center" style="margin-top:18px"><button type="button" class="link-btn" id="forgot">Forgot password?</button></p>
  <p class="muted center">New member? <a href="signup.html">Create your account</a></p>
</form>
</main>
<footer>Central Pacific Ski Club · San Luis Obispo</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
<script>
boot('guest').then(() => {
  if (new URLSearchParams(location.search).has('gone')) showMsg($('#msg'), 'That account has been removed. Ask an exec board member if this is a mistake.');
  $('#f').onsubmit = async (e) => {
    e.preventDefault(); $('#go').disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#password').value });
    if (error) {
      $('#go').disabled = false;
      return showMsg($('#msg'), /confirm/i.test(error.message) ? 'Confirm your email first — check your inbox for the link.' : 'Wrong email or password.');
    }
    location.href = 'card.html';
  };
  $('#forgot').onclick = async () => {
    const email = $('#email').value.trim();
    if (!email) return showMsg($('#msg'), 'Type your email above first, then tap "Forgot password?" again.');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: new URL('reset.html', location.href).href });
    error ? showMsg($('#msg'), error.message) : showMsg($('#msg'), 'If that email has an account, a reset link is on its way.', true);
  };
}).catch(() => {});
</script>
</body></html>
